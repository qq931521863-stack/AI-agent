  <h1>这份 26 周计划已不再适用</h1>
  <p>它假设<b>有实机可上电实测</b>：其中 S2（LCR 实测反推，4 周）和 S4（上电验证，4 周）都以公司样机为前提。在没有实机的条件下，这两段无法执行。</p>
  <p>现行计划改为<b>以 PLECS 闭环仿真 + DLL 在环为唯一验证手段</b>，主线 26 周完全不依赖硬件，实机移到最后的 S8 作为验收。</p>
